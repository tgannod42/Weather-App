    <!-- TODO: Link your JavaScript file here -->
    <!-- This script will: -->
    <!-- 1. Call the Open-Meteo API -->
    <!-- 2. Retrieve temperature and humidity -->
    <!-- 3. Determine weather condition -->
    <!-- 4. Update the HTML elements on the page -->

    <script>

        // Base URL for Open-Meteo API requests
        const url = 'https://api.open-meteo.com/v1/'

        // Weather code meanings taken from the WMO weather interpretation table.
        // This helper function converts the numeric weather code returned by the API
        // into a human-readable weather condition description.
        function getWeather(code) {
            const weatherCodes = {
                0: 'Clear sky',
                1: 'Mainly clear',
                2: 'Partly cloudy',
                3: 'Overcast',
                45: 'Fog',
                51: 'Light drizzle',
                53: 'Moderate drizzle',
                55: 'Dense drizzle',
                61: 'Slight rain',
                63: 'Moderate rain',
                65: 'Heavy rain',
                71: 'Slight snow',
                73: 'Moderate snow',
                75: 'Heavy snow',
                80: 'Rain showers',
                95: 'Thunderstorm',
            }
            return weatherCodes[code] || 'Unknown Conditions'
        }

        // Function that selects an appropriate Bootstrap weather icon
        // based on the weather code returned by the API
        function getWeatherIcon(code) {
            if (code === 0 || code === 1) return "bi-sun-fill"
            else if (code === 2 || code === 3) return "bi-cloud-sun-fill"
            else if ([61,63,65,80].includes(code)) return "bi-cloud-rain-fill"
            else if ([71,73,75].includes(code)) return "bi-snow"
            else if (code === 95) return "bi-cloud-lightning-fill"
            else if (code === 45) return "bi-cloud-fog-fill"
            else return "bi-cloud"
        }

            (async () => {
                try {
                    // Request current weather data from Open-Meteo
                    const objResponse = await fetch(`${url}forecast?latitude=36.1628&longitude=-85.5016&current=temperature_2m,relative_humidity_2m,is_day,wind_speed_10m,precipitation,rain,showers,cloud_cover,weather_code&wind_speed_unit=mph&temperature_unit=fahrenheit&precipitation_unit=inch`);

                    if (!objResponse.ok) {
                        throw new Error(`HTTP error! status: ${objResponse.status}`)
                    }

                    // Convert the API response into a usable JSON object
                    const objData = await objResponse.json()

                    // Split the current weather values and the unit labels from the response
                    const objCurrent = objData.current
                    const objUnits = objData.current_units

                    // Determine the readable weather description using the helper function
                    const strConditions = getWeather(objCurrent.weather_code)

                    // Update the spans on the page with the weather data retrieved from the API
                    document.querySelector('#txtConditions').innerHTML = strConditions
                    document.querySelector('#txtTemperature').innerHTML = `${objCurrent.temperature_2m}${objUnits.temperature_2m}`
                    document.querySelector('#txtHumidity').innerHTML = `${objCurrent.relative_humidity_2m}${objUnits.relative_humidity_2m}`

                    // Update the weather icon dynamically based on the weather code
                    const iconClass = getWeatherIcon(objCurrent.weather_code)
                    document.querySelector('#weatherIcon').className = `bi ${iconClass} display-1`

                } catch (objError) {
                    // If the API call fails, display an error popup to the user
                    Swal.fire({
                        title: "Oh no, something went wrong!",
                        icon: "error",
                        text: objError.message
                    });
                }
            })()
    </script>
